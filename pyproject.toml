[project]
name = "yamlin"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Bart Frenk", email = "bart.frenk@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
yamlin = "yamlin.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["devtools>=0.12.2"]
test = ["pytest>=8.3.4", "pytest-asyncio>=0.25.3", "pytest-cov>=6.2.1"]
lint = ["black>=24.2.0", "isort>=5.6.4"]

[tool.pyright]
reportUnusedCallResult = false

[tool.black]
line-length = 99
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 99

[tool.pytest.ini_options]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_level = "DEBUG"
asyncio_default_fixture_loop_scope = "function"
